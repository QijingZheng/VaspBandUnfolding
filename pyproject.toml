[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "PyVaspWfc"
version = "1.0"
description = "Python modules for dealing with VASP pseudo-wavefunctions."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Qijing Zheng", email = "zqj.kaka@gmail.com" },
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "ase",
]

[project.urls]
Homepage = "https://github.com/QijingZheng/VaspBandUnfolding"

[tool.setuptools]
py-modules = [
  "vasp_constant",
  "vaspwfc",
  "aewfc",
  "nac",
  "unfold",
  "procar",
  "spinorb",
  "sph_harm",
  "paw",
  "ewald",
  "coulomb_integral",
  "bse",
]
script-files = [
  "bin/wfcplot",
  "bin/tdmplot",
  "bin/potplot",
  "bin/nebplot",
  "bin/bseplot",
]
